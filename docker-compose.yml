# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: redshot
      POSTGRES_PASSWORD: redshot
      POSTGRES_DB: redshot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
